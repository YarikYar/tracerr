version: '3.8'

services:
  ton-tracer-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ton-tracer-api
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
    command: ["-port", "8080"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Optional: Testnet version
  ton-tracer-api-testnet:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ton-tracer-api-testnet
    ports:
      - "8081:8080"
    environment:
      - GIN_MODE=release
    command: ["-port", "8080", "-testnet"]
    restart: unless-stopped
    profiles: ["testnet"]  # Only starts when specified
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
